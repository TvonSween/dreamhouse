<!DOCTYPE html>
<html lang="en">
   <head>
      <title>dreamHouse-rate</title>
      <link rel="icon" href="favicon.ico">
      <link rel="stylesheet" href="../css/site.css">
   </head>
   <body>
      <header>
         <nav>
            <a href="../index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="rate.html">Rate</a>
            <a href="configure.html">Configure</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
         </nav>
      </header>
      <main>
         <div  class="banner">
            <img src="../images/hero-image.jpg" alt="" aria-hidden="true">
            <div class="banner-text">
               <h1>Rate</h1>
            </div>
         </div>
         <div>
            <h2>Rate a property</h2>
            <p>Add your rating for different parts of the property.</p>
         </div>
            <form id="rateForm" action="" method="POST">
                  <label for="property">Property name: </label>
                  <input type="text" id="property" name="property" required>
             
                  <label for="bedrooms">Bedrooms: </label>
                  <input type="number" id="bedrooms" name="bedrooms" min="1" max="10">
               
                  <label for="bathroom">Bathroom(s): </label>
                  <input type="number" id="bathroom" name="bathroom" min="1" max="10">
               
                <label for="kitchen">Kitchen: </label>
                <input type="number" id="kitchen" name="kitchen" min="1" max="10">
            
                <label for="living">Living room: </label>
                <input type="number" id="living" name="living" min="1" max="10">
             
                <label for="garden">Garden/back of property: </label>
                <input type="number" id="garden" name="garden" min="1" max="10">
             
                <label for="front">Driveway/front of property: </label>
                <input type="number" id="front" name="front" min="1" max="10">
            
                <label for="location">Location: </label>
                <input type="number" id="location" name="location" min="1" max="10">
            
                <label for="commute">Commute: </label>
                <input type="number" id="commute" name="commute" min="1" max="10">
          
                <label for="amenities">Local amenities: </label>
                <input type="number" id="amenities" name="amenities" min="1" max="10">
               
                <div>
               <label for="like">Do you like this property? </label>
               <input type="checkbox" id="like" name="like" value="Like">
                </div>
            
                <label for="pros">Pros: </label>
                <textarea type="text" id="pros" name="pros" rows="2"></textarea>

                <label for="cons">Cons: </label>
                <textarea type="text" id="cons" name="cons" rows="2"></textarea>

               <div>
                  <button type="submit">Submit Form</button>
                  <button type="reset">Reset Form</button>
               </div>
            </form>

      </main>
      <footer>
         &copy; dreamHouse 2025. Designed by T Vaughan.
      </footer>
      <script src="../js/app.js"></script>
      <script>app.rate();
      </script>
   </body>
</html>
