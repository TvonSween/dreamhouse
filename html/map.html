<!DOCTYPE html>
<html lang="en">
   <head>
      <title>dreamHouse-map</title>
      <link rel="icon" href="favicon.ico">
      <link rel="stylesheet" href="../css/site.css">
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
      <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.css" >
      <script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>
   </head>
   <body>
      <header>
         <nav>
            <a href="../index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="rate.html">Rate</a>
            <a href="configure.html">Configure</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
         </nav>
      </header>
      <main>
         <div  class="banner">
            <img src="../images/hero-image.jpg" alt="" aria-hidden="true">
            <div class="banner-text">
               <h1>Map & Ratings</h1>
            </div>
         </div>
         <div>
            <div>
            <h2>Map & Ratings</h2>
            <div id="map"></div>
            </div>
         </div>
         <section>
         <div>
         <table id="ratingTable" class="display">
            <thead>
                <tr>
                    <th>Property</th>
                    <th>Bedrooms</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Row 1 Data 1</td>
                    <td>Row 1 Data 2</td>
                   <td>Row 1 Data 3</td>
                </tr>
                <tr>
                    <td>Row 2 Data 1</td>
                    <td>Row 2 Data 2</td>
                   <td>Row 2 Data 3</td>
                </tr>
                <tr>
                    <td>Row 3 Data 1</td>
                    <td>Row 3 Data 2</td>
                   <td>Row 3 Data 3</td>
                </tr>
            </tbody>
        </table>
      </div>
   </section>
</main>
      <footer>
         &copy; dreamHouse 2025. Designed by T Vaughan.
      </footer>
      <script src="../js/app.js"></script>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
      <script>
      $(Document).ready( 
      function () {
       $('#ratingTable').DataTable();
         } );

         let table = new DataTable('#ratingTable', {
             responsive: true
         });

         var map = L.map('map').setView([55.861, -4.25], 13);
         L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
           attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var marker = L.marker([55.85, -4.25]).addTo(map);
        marker.bindPopup("<b>Laurieston Road</b><br>Score:84").openPopup();

        var popup = L.popup()
            .setLatLng([55.860, -4.25])
            .setContent("I am a standalone popup.")
            .openOn(map);

            function onMapClick(e) {
                popup
                    .setLatLng(e.latlng)
                    .setContent("You clicked the map at " + e.latlng.toString())
                    .openOn(map);
            }
            
            map.on('click', onMapClick);
         
      </script>
   </body>
</html>
