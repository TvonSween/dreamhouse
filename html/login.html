<!DOCTYPE html>
<html lang="en">
   <head>
      <title>dreamHouse-login</title>
      <link rel="icon" href="favicon.ico">
      <link rel="stylesheet" href="../css/site.css">
   </head>
   <body>
      <header>
         <nav>
            <a href="../index.html">Home</a>
            <a href="map.html">Map</a>
            <a href="rate.html">Rate</a>
            <a href="configure.html">Configure</a>
            <a href="register.html">Register</a>
            <a href="login.html">Login</a>
         </nav>
      </header>
      <main>
         <div  class="banner">
            <img src="../images/hero-image.jpg" alt="" aria-hidden="true">
            <div class="banner-text">
               <h1>Login</h1>
            </div>
         </div>
         <div id="login-message">
            <h2>Login</h2>
            <p id="complete-login">Log in to add a new entry.
            </p>
         </div>
         <div>
            <form id="loginForm" action="" method="POST">
                  <label for="username">Username: </label>
                  <input type="text" id="username" name="username" required>
            
                  <label for="password">Password: </label>
                  <input type="password" id="password" name="password">
               <div>
                  <button type="submit">Submit Form</button>
                  <button type="reset">Reset Form</button>
                  </div>
            </form>
            </div>
      </main>
      <footer>
         &copy; dreamHouse 2025. Designed by T Vaughan.
      </footer>
      <script src="../js/app.js"></script>
      <script>app.loginStartUp()</script>
   </body>
